#
# Sage generic worker — Fly.io app config (M12.0.2, ADR-0020 пп.3–4).
#
# A SEPARATE app from sage-demo-agents: the 3-mode production demo stays the
# regression baseline until the first new pipeline passes e2e (ADR-0020 п.6),
# so its fly.toml is untouched and worker deploys never restart it. Same
# Dockerfile/image — only the entrypoint differs.
#
# One machine hosting N agent identities (WORKER_IDENTITIES selects which).
# Scale-to-zero is implemented by the worker's OWN idle-exit, not by proxy
# autostop: Fly's autostop counts inbound connections, and a worker mid-task
# has none — it would be stopped mid-LLM-call. Hence:
#   auto_stop_machines  = "off"   (the process exits itself when idle)
#   auto_start_machines = true    (a /wake ping boots a stopped machine)
#   min_machines_running = 0
#
# Deploy — ALL fly commands run from the REPO ROOT (/mnt/d/Sage), never from
# apps/demo-agents/: the Dockerfile needs the monorepo build context (see
# docs/runbooks/deploy-demo-agents-flyio.md + the M10.2.9 mis-step).
#   fly apps create sage-workers --org personal
#   fly secrets set -c apps/demo-agents/fly.workers.toml --stage \
#       CHAIN=mainnet WORKER_IDENTITIES=echo ECHO_PRIVATE_KEY=0x… \
#       RPC_URL=https://sage-gateway.a-t-somnia.workers.dev/api/rpc SAGE_BACKEND_KEY=…
#     (CHAIN is REQUIRED — the worker refuses to boot without it; the shared
#      loader's URL-sniffing once silently sent prod to Sepolia, see GOTCHAS.
#      RPC_URL must be the gateway: the public mainnet.base.org node
#      rate-limits the reconcile scan burst after ~4 reads — observed at the
#      first sage-workers deploy 2026-06-10; the cursor parks and recovers,
#      but the scan crawls. SAGE_BACKEND_KEY = same value as sage-demo-agents.)
#   fly deploy -c apps/demo-agents/fly.workers.toml --ha=false --remote-only
#     (--ha=false: no standby machines — org cap is 20, see GOTCHAS
#      "Fly org machine limit")
#

app = "sage-workers"
primary_region = "iad"

# Aligned with the worker's WORKER_DRAIN_TIMEOUT_MS (110s): SIGTERM → drain
# in-flight accept→complete spans → exit, before Fly hard-kills.
kill_timeout = 120

[build]
  dockerfile = "Dockerfile"
  # Chromium-bearing stage for the QA gate (M12.1.2); the default (last)
  # stage stays chromium-free for the 3-mode demo app.
  build-target = "workers"

[env]
  NODE_ENV = "production"
  PORT = "3100"
  # CHAIN / CHAIN_ID intentionally NOT defaulted here — set via secrets/env
  # explicitly per deployment (see header).

[processes]
  worker = "node dist/worker/server.js"

[[services]]
  processes       = ["worker"]
  protocol        = "tcp"
  internal_port   = 3100
  auto_stop_machines   = "off"
  auto_start_machines  = true
  min_machines_running = 0

  [[services.ports]]
    port     = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type       = "connections"
    soft_limit = 20
    hard_limit = 50

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"  # Lighthouse + chromium OOM on 512MB (M12.1.2); scale-to-zero keeps idle cost at zero
  processes = ["worker"]

[deploy]
  strategy = "immediate"
