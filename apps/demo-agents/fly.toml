#
# Sage demo-agents — Fly.io app config.
# One app, three processes (orchestrator, summarizer, translator).
# Orchestrator is the only process exposed on public HTTP; the other two watch
# on-chain events directly and don't need inbound HTTP.
#
# Deploy:
#   fly launch --no-deploy                    (first time — accepts region + app name)
#   fly secrets set PRIVATE_KEY=0x...         (per runbook)
#   fly deploy
#

app = "sage-demo-agents"
primary_region = "iad"                         # us-east; move closer to Alchemy if needed

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  RPC_URL = "https://mainnet.base.org"
  ALLOWED_ORIGINS = "https://sage-protocol.pages.dev,https://sage.xyz"

[processes]
  orchestrator = "node dist/orchestrator/server.js"
  summarizer   = "node dist/summarizer/agent.js"
  translator   = "node dist/translator/agent.js"
  vision       = "node dist/vision/agent.js"
  sentiment    = "node dist/sentiment/agent.js"

# Only the orchestrator handles external HTTP.
# Public surface — keep one machine warm so demo cold-starts don't add 5–10s
# to the user-visible timeline. With auto_start_machines=true a stopped peer
# still resurrects on demand for HA / rolling deploys.
[[services]]
  processes       = ["orchestrator"]
  protocol        = "tcp"
  internal_port   = 3000
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 1                     # M9.8.3 — keep a hot machine

  [[services.ports]]
    port     = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type       = "connections"
    soft_limit = 20
    hard_limit = 50

  # Liveness — TCP open is the floor, the app is dead long before that.
  [[services.tcp_checks]]
    interval      = "15s"
    timeout       = "2s"
    grace_period  = "10s"

  # Real liveness — /health verifies RPC connectivity + sponsor balance.
  # Returns 200 when accepting demos, 503 when sponsor is exhausted (still
  # alive, just refusing new runs). We treat 503 as "machine OK, app degraded"
  # — Fly will keep it in rotation; alerting on /health body.accepting belongs
  # in M9.8.4 (Cloudflare Observability + sponsor-balance alarm).
  [[services.http_checks]]
    interval      = "30s"
    timeout       = "5s"
    grace_period  = "20s"
    method        = "GET"
    path          = "/health"
    protocol      = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["orchestrator", "summarizer", "translator", "vision", "sentiment"]

# Persistent volume not required — orchestrator is stateless (active demo
# channels live in memory; completed runs are flushed via SSE `done` event).

[deploy]
  strategy = "rolling"

[metrics]
  port = 9091
  path = "/metrics"                           # reserved for M-INT.8 observability
