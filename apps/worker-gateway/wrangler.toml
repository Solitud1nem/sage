#
# Sage gateway — Cloudflare Worker.
#   /api/rpc        → Alchemy JSON-RPC proxy (key hidden via secret)
#   /api/demo/*     → Fly.io orchestrator passthrough + rate limit on /api/demo/start
#   /health         → passthrough to orchestrator /health
#
# Deploy:
#   wrangler d1 create sage-rate-limits        # one-time, copy database_id into this file
#   pnpm db:init                                # apply schema.sql
#   wrangler secret put ALCHEMY_KEY             # per environment
#   wrangler deploy
#

name = "sage-gateway"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ORCHESTRATOR_URL = "https://sage-demo-agents.fly.dev"
# ADR-0015 Arc bridge — Arc traffic (`?chain=arc`) routes to a sibling
# Fly app running the same image on Arc testnet. Leave as empty string
# until the Arc Fly app is deployed (deploy-arc-fly-app.md); empty falls
# through to the Base orchestrator and surfaces as chain-mismatch in UI.
ORCHESTRATOR_URL_ARC = "https://sage-demo-agents-arc.fly.dev"
ALCHEMY_BASE_URL = "https://base-mainnet.g.alchemy.com/v2"
# M13.3 reputation indexer — Base-mainnet TaskEscrow (V3, sage:escrow:v2 salt)
# and its deploy block (the backfill floor).
ESCROW_ADDRESS = "0x61c585630B32eee0b8c00306047c301B56419a81"
ESCROW_FROM_BLOCK = "47057463"
# ADR-0015 Arc-testnet reputation index. Arc TaskEscrow (deployed 2026-05-21 via
# Arachnid CREATE2, DeployArc.s.sol) + its deploy block. Arc isn't on Alchemy, so
# the indexer reads its public RPC directly. Both ARC_RPC_URL + ARC_ESCROW_ADDRESS
# must be set for Arc to index (else Base-only). `?chain=arc` serves Arc scores.
ARC_RPC_URL = "https://rpc.testnet.arc.network"
ARC_ESCROW_ADDRESS = "0xA9e6Dc31F21149868C0fd43C83038C74cC8Ffcdb"
ARC_ESCROW_FROM_BLOCK = "43314119"
DAILY_LIMIT = "30"  # TEMPORARY test rebaseline (Alex 2026-06-11, M12.1.3 hands-on testing) — public positioning is 3/IP/day (README/KB, Alex 2026-06-10); REVERT to "3" at M12.4.3 before the public narrative ships.
ALLOWED_ORIGINS = "https://sage-protocol.pages.dev,https://sage-web.pages.dev,http://localhost:3000,http://localhost:3001"

# D1 — rate limit counters.
[[d1_databases]]
binding = "DB"
database_name = "sage-rate-limits"
database_id = "397f247f-e53a-495e-9c9e-3aee244a158f"

# R2 — pipeline artifacts (M12.0.3, content-addressed by sha256; see
# src/artifacts.ts). One-time setup before the next deploy:
#   wrangler r2 bucket create sage-artifacts
#   wrangler r2 bucket lifecycle add sage-artifacts --expire-days 30
#     (demo artifacts are ephemeral; revisit the TTL before the M12.4
#      narrative pages go public)
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "sage-artifacts"

# M13.3 — reputation indexer cron. Every 10 min the scheduled() handler pulls
# new escrow events into D1 (task_index); steady-state is 1–2 getLogs calls.
[triggers]
crons = ["*/10 * * * *"]

# Observability.
[observability]
enabled = true
head_sampling_rate = 1.0

# Secrets (set via `wrangler secret put`, not committed):
#   ALCHEMY_KEY        — Alchemy API key for /api/rpc proxy
#   SAGE_BACKEND_KEY   — shared secret: Fly orchestrator → /api/rpc
#   SAGE_GATEWAY_KEY   — shared secret: gateway → Fly orchestrator (x-sage-gateway).
#                        Must match DEMO_GATEWAY_KEY in Fly secrets. Until both
#                        are set, the orchestrator accepts direct calls (legacy).

# Custom domain routes — uncomment when sage.xyz DNS is set up:
# [[routes]]
# pattern = "api.sage.xyz/*"
# zone_name = "sage.xyz"
